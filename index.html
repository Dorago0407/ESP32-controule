<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 画面の拡大（ピンチイン・ダブルタップ）を禁止 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLE ロボットコントローラー</title>
  <style>
    /* 画面全体の拡大・テキスト選択・タップハイライト・長押しルーペを防止 */
    * {
      touch-action: manipulation;
      -webkit-touch-callout: none;           /* 長押しによるルーペ・メニュー表示を禁止 */
      -webkit-user-select: none;             /* テキスト選択禁止 */
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #1e1e24;
      color: #ffffff;
      margin: 0;
      padding: 15px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .status-panel {
      background: #2b2d42;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .btn {
      background-color: #4a4e69;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:active {
      background-color: #9a8c98;
    }

    /* 十字キーコントローラーレイアウト */
    .controller {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }

    .ctrl-btn {
      background-color: #3a86ff;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .ctrl-btn:active {
      background-color: #00b4d8;
      transform: translateY(2px);
    }

    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-stop  { grid-column: 2; grid-row: 2; background-color: #e63946; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 3; }

    /* コントロールパネル (速度・センサー) */
    .panel {
      background: #2b2d42;
      padding: 15px;
      border-radius: 8px;
      max-width: 320px;
      margin: 10px auto;
    }

    .slider-container {
      margin: 10px 0;
    }

    input[type=range] {
      width: 100%;
    }

    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .sensor-box {
      background: #3d405b;
      padding: 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>BLE Robot Controller</h1>

  <div class="status-panel">
    <div>接続状態: <span id="ble-status" style="color: #ff4d4d;">未接続</span></div>
    <button class="btn" id="btn-connect" style="margin-top: 8px;">BLE接続</button>
  </div>

  <!-- 十字キー操作エリア -->
  <div class="controller">
    <button class="ctrl-btn btn-up" id="btn-forward">▲</button>
    <button class="ctrl-btn btn-left" id="btn-left">◀</button>
    <button class="ctrl-btn btn-stop" id="btn-stop">■</button>
    <button class="ctrl-btn btn-right" id="btn-right">▶</button>
    <button class="ctrl-btn btn-down" id="btn-backward">▼</button>
  </div>

  <!-- 速度調整 slider & モード切り替え -->
  <div class="panel">
    <div class="slider-container">
      <label for="speed-slider">速度 (Speed): <span id="speed-val">220</span></label>
      <input type="range" id="speed-slider" min="0" max="255" value="220">
    </div>
    
    <div style="margin-top: 10px;">
      <button class="btn" id="btn-mode-manual" style="background-color: #2a9d8f;">手動モード</button>
      <button class="btn" id="btn-mode-auto" style="background-color: #e76f51;">自動モード</button>
    </div>
  </div>

  <!-- センサー数値モニター -->
  <div class="panel">
    <div>センサーリアルタイムモニター</div>
    <div class="sensor-grid">
      <div class="sensor-box">S1: <span id="s1-val">0</span></div>
      <div class="sensor-box">S2: <span id="s2-val">0</span></div>
      <div class="sensor-box">S3: <span id="s3-val">0</span></div>
      <div class="sensor-box">S4: <span id="s4-val">0</span></div>
    </div>
  </div>

  <script>
    // 長押しルーペ・右クリックメニューの全ブロック
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    }, { passive: false });

    // Nordic UART Service UUIDs (ESP32側と完全一致)
    const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;
    let sendInterval = null;

    // --- BLE 接続処理 ---
    document.getElementById('btn-connect').addEventListener('click', async () => {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ROBOT' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        // Notify受信設定 (ESP32からのセンサーデータ用)
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        document.getElementById('ble-status').innerText = "接続完了";
        document.getElementById('ble-status').style.color = "#4ccc54";
      } catch (error) {
        console.error("BLE Connect Error:", error);
        alert("接続失敗: " + error);
      }
    });

    // --- ESP32からの受信データ処理 ---
    function handleNotifications(event) {
      const value = new TextDecoder().decode(event.target.value);
      // フォーマット解析例: "SENS:S1=512,S2=1024,S3=100,S4=200"
      if (value.startsWith("SENS:")) {
        const parts = value.replace("SENS:", "").split(",");
        parts.forEach(part => {
          const [key, val] = part.split("=");
          if (key === "S1") document.getElementById("s1-val").innerText = val;
          if (key === "S2") document.getElementById("s2-val").innerText = val;
          if (key === "S3") document.getElementById("s3-val").innerText = val;
          if (key === "S4") document.getElementById("s4-val").innerText = val;
        });
      }
    }

    // --- コマンド送信関数 ---
    async function sendCommand(cmd) {
      if (!rxCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValueWithoutResponse(encoder.encode(cmd));
      } catch (err) {
        console.error("Send Error:", err);
      }
    }

    // --- 連写送信付きボタンイベント登録 (Pointer Events) ---
    function bindButton(elementId, command) {
      const btn = document.getElementById(elementId);

      const startSending = (e) => {
        e.preventDefault(); // ダブルタップズームや長押しメニューの防止
        sendCommand(command);
        
        // 押し続けている間 100ms ごとに連射送信して通信落ちを補正
        if (sendInterval) clearInterval(sendInterval);
        sendInterval = setInterval(() => {
          sendCommand(command);
        }, 100);
      };

      const stopSending = (e) => {
        if (e) e.preventDefault();
        if (sendInterval) {
          clearInterval(sendInterval);
          sendInterval = null;
        }
        sendCommand("stop");
      };

      // タッチ/クリックの即時反応イベント (遅延0ms)
      btn.addEventListener("pointerdown", startSending, { passive: false });
      btn.addEventListener("pointerup", stopSending, { passive: false });
      btn.addEventListener("pointerleave", stopSending, { passive: false });
      btn.addEventListener("pointercancel", stopSending, { passive: false });
    }

    // 十字キーへバインド
    bindButton("btn-forward", "forward");
    bindButton("btn-backward", "backward");
    bindButton("btn-left", "left");
    bindButton("btn-right", "right");

    // 停止ボタン
    document.getElementById("btn-stop").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (sendInterval) clearInterval(sendInterval);
      sendCommand("stop");
    }, { passive: false });

    // 速度スライダー
    const slider = document.getElementById("speed-slider");
    slider.addEventListener("change", (e) => {
      const val = e.target.value;
      document.getElementById("speed-val").innerText = val;
      sendCommand(`speed:${val}`);
    });

    // モード切替
    document.getElementById("btn-mode-manual").addEventListener("click", () => sendCommand("mode_manual"));
    document.getElementById("btn-mode-auto").addEventListener("click", () => sendCommand("mode_auto"));
  </script>
</body>
</html>
