<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 画面拡大・ピンチズーム・ダブルタップ拡大を無効化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROBOT CONTROLLER</title>
  <style>
    /* ----------------------------------------------------
       長押しルーペ・テキスト選択・コンテキストメニューの完全遮断
    ---------------------------------------------------- */
    * {
      touch-action: manipulation;            /* ダブルタップ拡大防止 */
      -webkit-touch-callout: none;           /* 長押しルーペ・メニュー禁止 (iOS/Android) */
      -webkit-user-select: none;             /* テキスト選択禁止 */
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent; /* タップ時のハイライト消去 */
      box-sizing: border-box;
    }

    body {
      background-color: #031319;
      color: #00ffcc;
      font-family: monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ヘッダー */
    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00ffcc;
      padding-bottom: 4px;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .time-display {
      color: #00ffcc;
    }

    .disconnect-btn {
      background: transparent;
      border: none;
      color: #ff3366;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85rem;
    }

    /* メインエリア */
    .main-container {
      display: flex;
      width: 100%;
      max-width: 900px;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    /* ボタン共通（矢印・カットオフ角デザイン） */
    .btn-square {
      width: 90px;
      height: 90px;
      background: rgba(0, 255, 204, 0.03);
      border: 2px solid #00ffcc;
      color: #00ffcc;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      clip-path: polygon(0 0, 80% 0, 100% 20%, 100% 100%, 0 100%);
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.15);
    }

    .btn-square:active {
      background: rgba(0, 255, 204, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
    }

    .left-controls, .right-controls {
      display: flex;
      gap: 15px;
    }

    .vert-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* 中央パネル */
    .center-panel {
      width: 340px;
      background: rgba(0, 20, 30, 0.85);
      border: 1px solid #00ffcc;
      padding: 12px;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
    }

    .mode-switch {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      cursor: pointer;
      font-family: monospace;
      font-weight: bold;
    }

    .mode-btn.active {
      background: #00ffcc;
      color: #000000;
      box-shadow: 0 0 10px #00ffcc;
    }

    /* センサー枠 */
    .sensor-box {
      border: 1px solid rgba(0, 255, 204, 0.4);
      padding: 8px;
      margin-top: 8px;
      font-size: 0.8rem;
    }

    .sensor-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      border-bottom: 1px dashed rgba(0, 255, 204, 0.3);
      padding-bottom: 4px;
    }

    .sensor-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }

    .sensor-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid #00ffcc;
    }

    .sensor-bar-fill {
      height: 100%;
      background: #00ffcc;
      width: 0%;
    }

    .sensor-status-tag {
      border: 1px solid rgba(0, 255, 204, 0.4);
      padding: 1px 4px;
      font-size: 0.7rem;
    }

    /* 実行ログ */
    .exec-log {
      margin-top: 10px;
      border-top: 1px solid rgba(0, 255, 204, 0.3);
      padding-top: 6px;
      font-size: 0.75rem;
      height: 75px;
      overflow-y: hidden;
      color: #00ff99;
    }

    /* 非常停止 */
    .emergency-btn {
      width: 100%;
      max-width: 420px;
      margin-top: 15px;
      padding: 10px;
      background: transparent;
      border: 2px solid #ff3366;
      color: #ff3366;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 51, 102, 0.3);
    }

    .emergency-btn:active {
      background: #ff3366;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ヘッダーバー -->
  <div class="header-bar">
    <div>STATUS: <span id="ble-status" style="color: #00ffcc;">CONNECTED</span></div>
    <div class="time-display" id="clock">16:51:04</div>
    <div><button class="disconnect-btn" id="btn-connect">[ DISCONNECT ]</button></div>
  </div>

  <!-- コントローラー本体 -->
  <div class="main-container">
    
    <!-- 左側：上下移動 -->
    <div class="left-controls">
      <div class="vert-group">
        <button class="btn-square" id="btn-forward">▲</button>
        <button class="btn-square" id="btn-backward">▼</button>
      </div>
    </div>

    <!-- 中央：モード切り替え & センサー & ログ -->
    <div class="center-panel">
      <div class="mode-switch">
        <button class="mode-btn active" id="btn-manual">🎮 MANUAL</button>
        <button class="mode-btn" id="btn-auto">🤖 AUTO</button>
      </div>

      <div class="sensor-box">
        <div class="sensor-header">
          <span>◀ PREV</span>
          <span>SENSORS (1/2)</span>
          <span>NEXT ►</span>
        </div>
        
        <div class="sensor-row">
          <span>S1</span>
          <span style="width: 35px; text-align: right;" id="s1-val">0</span>
          <div class="sensor-bar-bg"><div class="sensor-bar-fill" id="s1-bar" style="width: 0%;"></div></div>
          <span class="sensor-status-tag">OFF</span>
        </div>

        <div class="sensor-row">
          <span>S2</span>
          <span style="width: 35px; text-align: right;" id="s2-val">256</span>
          <div class="sensor-bar-bg"><div class="sensor-bar-fill" id="s2-bar" style="width: 25%;"></div></div>
          <span class="sensor-status-tag">OFF</span>
        </div>
      </div>

      <div class="exec-log" id="log-box">
        <div>:: EXEC: STOP ::</div>
        <div>> STATUS: STOP</div>
      </div>
    </div>

    <!-- 右側：左右旋回 -->
    <div class="right-controls">
      <button class="btn-square" id="btn-left">◀</button>
      <button class="btn-square" id="btn-right">▶</button>
    </div>

  </div>

  <!-- EMERGENCY STOP -->
  <button class="emergency-btn" id="btn-stop">!! EMERGENCY STOP !!</button>

  <script>
    // ----------------------------------------------------
    // 長押しによるルーペ（拡大鏡）やコンテキストメニューの呼び出しを停止
    // ----------------------------------------------------
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    }, { passive: false });

    // 時計の更新
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').innerText = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // BLE設定
    const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;
    let sendInterval = null;

    const logBox = document.getElementById('log-box');

    function log(msg) {
      const line = document.createElement('div');
      line.innerText = "> " + msg;
      logBox.appendChild(line);
      if (logBox.childNodes.length > 5) logBox.removeChild(logBox.firstChild);
    }

    // BLE 接続処理
    document.getElementById('btn-connect').addEventListener('click', async () => {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ROBOT' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        document.getElementById('ble-status').innerText = "CONNECTED";
        log("CONNECTED TO BLE");
      } catch (error) {
        log("CONNECT FAILED");
      }
    });

    // センサー通知受信用
    function handleNotifications(event) {
      const value = new TextDecoder().decode(event.target.value);
      if (value.startsWith("SENS:")) {
        const parts = value.replace("SENS:", "").split(",");
        parts.forEach(part => {
          const [key, val] = part.split("=");
          const num = parseInt(val, 10);
          if (key === "S1") {
            document.getElementById("s1-val").innerText = val;
            document.getElementById("s1-bar").style.width = Math.min(100, (num / 1024) * 100) + "%";
          }
          if (key === "S2") {
            document.getElementById("s2-val").innerText = val;
            document.getElementById("s2-bar").style.width = Math.min(100, (num / 1024) * 100) + "%";
          }
        });
      } else {
        log(value);
      }
    }

    // コマンド送信
    async function sendCommand(cmd) {
      if (!rxCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValueWithoutResponse(encoder.encode(cmd));
      } catch (err) {
        console.error(err);
      }
    }

    // ----------------------------------------------------
    // ボタンの長押しルーペ対策 & 連射処理
    // ----------------------------------------------------
    function bindControl(elementId, command) {
      const btn = document.getElementById(elementId);

      const startAction = (e) => {
        e.preventDefault(); // ルーペ等の発生を防止
        sendCommand(command);
        log("STATUS: " + command.toUpperCase());

        if (sendInterval) clearInterval(sendInterval);
        sendInterval = setInterval(() => {
          sendCommand(command);
        }, 100);
      };

      const stopAction = (e) => {
        if (e) e.preventDefault();
        if (sendInterval) {
          clearInterval(sendInterval);
          sendInterval = null;
        }
        sendCommand("stop");
        log("STATUS: STOP");
      };

      btn.addEventListener("pointerdown", startAction, { passive: false });
      btn.addEventListener("pointerup", stopAction, { passive: false });
      btn.addEventListener("pointerleave", stopAction, { passive: false });
      btn.addEventListener("pointercancel", stopAction, { passive: false });
    }

    bindControl("btn-forward", "forward");
    bindControl("btn-backward", "backward");
    bindControl("btn-left", "left");
    bindControl("btn-right", "right");

    document.getElementById("btn-stop").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (sendInterval) clearInterval(sendInterval);
      sendCommand("stop");
      log("STATUS: STOP");
    }, { passive: false });

    // モード切替
    document.getElementById("btn-manual").addEventListener("click", () => {
      document.getElementById("btn-manual").classList.add("active");
      document.getElementById("btn-auto").classList.remove("active");
      sendCommand("mode_manual");
    });

    document.getElementById("btn-auto").addEventListener("click", () => {
      document.getElementById("btn-auto").classList.add("active");
      document.getElementById("btn-manual").classList.remove("active");
      sendCommand("mode_auto");
    });
  </script>
</body>
</html>
