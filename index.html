<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 1. 拡大・ピンチズーム・ダブルタップ拡大を無効化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLE ROBOT CONTROLLER</title>
  <style>
    /* ----------------------------------------------------
       2. 長押しルーペ・テキスト選択・コンテキストメニューを完全遮断
    ---------------------------------------------------- */
    * {
      touch-action: manipulation;            /* ダブルタップ拡大防止 */
      -webkit-touch-callout: none;           /* 長押しメニュー・ルーペ禁止 (iOS/Android) */
      -webkit-user-select: none;             /* テキスト選択禁止 */
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent; /* タップ時の青枠消去 */
      box-sizing: border-box;
    }

    body {
      background-color: #050b14;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden; /* スクロール発動による拡大誤作動防止 */
    }

    /* ヘッダーバー */
    .header-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00f0ff;
      padding-bottom: 5px;
      font-size: 0.8rem;
    }

    .disconnect-btn {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff0055;
      padding: 2px 8px;
      cursor: pointer;
    }

    /* メインレイアウト */
    .main-container {
      display: flex;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    /* ボタンデザイン */
    .btn-arrow {
      width: 80px;
      height: 80px;
      background: rgba(0, 240, 255, 0.05);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-size: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .btn-arrow:active {
      background: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    }

    /* 左右のボタン配置 */
    .left-controls, .right-controls {
      display: flex;
      gap: 15px;
    }

    .vert-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* 中央パネル */
    .center-panel {
      width: 320px;
      background: rgba(0, 20, 40, 0.8);
      border: 1px solid #00f0ff;
      padding: 10px;
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1);
    }

    .mode-switch {
      display: flex;
      margin-bottom: 10px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      cursor: pointer;
      font-weight: bold;
    }

    .mode-btn.active {
      background: #00f0ff;
      color: #000;
      box-shadow: 0 0 10px #00f0ff;
    }

    .sensor-monitor {
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px;
      margin-top: 8px;
      font-size: 0.75rem;
    }

    .log-box {
      height: 70px;
      background: #000;
      border: 1px solid rgba(0, 240, 255, 0.3);
      margin-top: 8px;
      padding: 5px;
      font-size: 0.7rem;
      overflow-y: hidden;
      color: #00ffaa;
    }

    /* 非常停止ボタン */
    .emergency-btn {
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
      padding: 10px;
      background: transparent;
      border: 2px solid #ff0055;
      color: #ff0055;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
      cursor: pointer;
    }

    .emergency-btn:active {
      background: #ff0055;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header-bar">
    <div>STATUS: <span id="ble-status">DISCONNECTED</span></div>
    <div><button class="disconnect-btn" id="btn-connect">[ CONNECT ]</button></div>
  </div>

  <!-- メイン操作エリア -->
  <div class="main-container">
    
    <!-- 左側：前後ボタン -->
    <div class="left-controls">
      <div class="vert-group">
        <button class="btn-arrow" id="btn-forward">▲</button>
        <button class="btn-arrow" id="btn-backward">▼</button>
      </div>
    </div>

    <!-- 中央：ステータス＆モード設定 -->
    <div class="center-panel">
      <div class="mode-switch">
        <button class="mode-btn active" id="btn-manual">🎮 MANUAL</button>
        <button class="mode-btn" id="btn-auto">🤖 AUTO</button>
      </div>

      <div class="sensor-monitor">
        <div>SENSORS</div>
        <div>S1: <span id="s1-val">0</span> | S2: <span id="s2-val">0</span></div>
        <div>S3: <span id="s3-val">0</span> | S4: <span id="s4-val">0</span></div>
      </div>

      <div class="log-box" id="log-box">
        :: SYSTEM READY ::
      </div>
    </div>

    <!-- 右側：左右旋回ボタン -->
    <div class="right-controls">
      <button class="btn-arrow" id="btn-left">◀</button>
      <button class="btn-arrow" id="btn-right">▶</button>
    </div>

  </div>

  <!-- 非常停止 -->
  <button class="emergency-btn" id="btn-stop">!! EMERGENCY STOP !!</button>

  <script>
    // ----------------------------------------------------
    // 3. 長押しメニュー・右クリック・コンテキストメニューの無効化
    // ----------------------------------------------------
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault(); // 長押しでルーペやメニューが出るのを防止
      return false;
    }, { passive: false });

    // BLE設定
    const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;
    let sendInterval = null;

    const logBox = document.getElementById('log-box');

    function log(msg) {
      const line = document.createElement('div');
      line.innerText = "> " + msg;
      logBox.appendChild(line);
      if (logBox.childNodes.length > 5) logBox.removeChild(logBox.firstChild);
    }

    // BLE 接続処理
    document.getElementById('btn-connect').addEventListener('click', async () => {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ROBOT' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        document.getElementById('ble-status').innerText = "CONNECTED";
        document.getElementById('ble-status').style.color = "#00f0ff";
        log("CONNECTED TO BLE");
      } catch (error) {
        log("CONNECT FAILED");
      }
    });

    // ESP32からの通知受信用
    function handleNotifications(event) {
      const value = new TextDecoder().decode(event.target.value);
      if (value.startsWith("SENS:")) {
        const parts = value.replace("SENS:", "").split(",");
        parts.forEach(part => {
          const [key, val] = part.split("=");
          if (key === "S1") document.getElementById("s1-val").innerText = val;
          if (key === "S2") document.getElementById("s2-val").innerText = val;
          if (key === "S3") document.getElementById("s3-val").innerText = val;
          if (key === "S4") document.getElementById("s4-val").innerText = val;
        });
      } else {
        log(value);
      }
    }

    // コマンド送信
    async function sendCommand(cmd) {
      if (!rxCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValueWithoutResponse(encoder.encode(cmd));
      } catch (err) {
        console.error(err);
      }
    }

    // ----------------------------------------------------
    // 4. ボタン押しっぱなし連射 & 長押しルーペ防止処理 (Pointer Events)
    // ----------------------------------------------------
    function bindControl(elementId, command) {
      const btn = document.getElementById(elementId);

      const startAction = (e) => {
        e.preventDefault(); // デフォルト動作（ルーペ・選択）のキャンセル
        sendCommand(command);
        log("EXEC: " + command.toUpperCase());

        // 押している間 100ms 間隔で連射送信
        if (sendInterval) clearInterval(sendInterval);
        sendInterval = setInterval(() => {
          sendCommand(command);
        }, 100);
      };

      const stopAction = (e) => {
        if (e) e.preventDefault();
        if (sendInterval) {
          clearInterval(sendInterval);
          sendInterval = null;
        }
        sendCommand("stop");
        log("EXEC: STOP");
      };

      // pointerdown: 指が触れた瞬間に作動（0ミリ秒反応）
      btn.addEventListener("pointerdown", startAction, { passive: false });
      btn.addEventListener("pointerup", stopAction, { passive: false });
      btn.addEventListener("pointerleave", stopAction, { passive: false });
      btn.addEventListener("pointercancel", stopAction, { passive: false });
    }

    // ボタンのバインド
    bindControl("btn-forward", "forward");
    bindControl("btn-backward", "backward");
    bindControl("btn-left", "left");
    bindControl("btn-right", "right");

    // 非常停止
    document.getElementById("btn-stop").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (sendInterval) clearInterval(sendInterval);
      sendCommand("stop");
      log("EXEC: EMERGENCY STOP");
    }, { passive: false });

    // モード切替
    document.getElementById("btn-manual").addEventListener("click", () => {
      document.getElementById("btn-manual").classList.add("active");
      document.getElementById("btn-auto").classList.remove("active");
      sendCommand("mode_manual");
    });

    document.getElementById("btn-auto").addEventListener("click", () => {
      document.getElementById("btn-auto").classList.add("active");
      document.getElementById("btn-manual").classList.remove("active");
      sendCommand("mode_auto");
    });
  </script>
</body>
</html>
