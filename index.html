<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESP32 BLE CONTROLLER & MONITOR</title>
    <style>
        :root { 
            --neon-blue: #00ffff; 
            --neon-red: #ff0055; 
            --neon-green: #00ff00; 
            --bg-dark: #050a10; 
        }
        
        * { 
            -webkit-user-select: none; 
            user-select: none; 
            touch-action: none; 
            box-sizing: border-box; 
            -webkit-touch-callout: none;
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--neon-blue); 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
        }
        
        /*走査線エフェクト*/
        body::after { 
            content: ""; 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); 
            background-size: 100% 4px; 
            pointer-events: none; 
            z-index: 1000; 
        }

        /* スタート画面 */
        #start-screen { 
            position: fixed; 
            inset: 0; 
            background: var(--bg-dark); 
            z-index: 10001; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        .shimmer { 
            font-size: 28px; 
            text-shadow: 0 0 15px var(--neon-blue); 
            animation: blink 2s infinite; 
            margin-bottom: 30px; 
        }

        .mode-btn { 
            background: none; 
            border: 2px solid var(--neon-blue); 
            color: var(--neon-blue); 
            padding: 15px 30px; 
            font-family: inherit; 
            cursor: pointer; 
            width: 260px; 
            font-size: 18px; 
            transition: 0.3s; 
        }
        .mode-btn:active { 
            background: rgba(0, 255, 255, 0.2); 
            box-shadow: 0 0 15px var(--neon-blue); 
        }

        /* メインUI */
        #main-ui { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
        }

        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 20px; 
            border-bottom: 2px solid var(--neon-blue); 
            font-size: 12px; 
            background: rgba(0, 255, 255, 0.05); 
            align-items: center; 
        }

        .controller-root { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex: 1; 
            padding: 10px 30px; 
        }
        
        /* 十字操作ボタン */
        .btn { 
            width: 85px; 
            height: 85px; 
            background: rgba(0, 255, 255, 0.05); 
            border: 1px solid var(--neon-blue); 
            color: var(--neon-blue); 
            font-size: 28px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%); 
            cursor: pointer;
        }
        .btn:active { 
            background: var(--neon-blue); 
            color: #000; 
            box-shadow: 0 0 20px var(--neon-blue); 
        }
        
        /* 中央モニター */
        .monitor { 
            background: rgba(0, 255, 255, 0.02); 
            border: 1px solid rgba(0, 255, 255, 0.2); 
            padding: 10px; 
            font-size: 11px; 
            width: 310px; 
        }

        /* モード切替ボタン */
        .mode-toggle-container { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
            gap: 6px; 
        }
        .mode-toggle-btn { 
            flex: 1; 
            padding: 6px 0; 
            background: rgba(0, 255, 255, 0.05); 
            border: 1px solid var(--neon-blue); 
            color: var(--neon-blue); 
            font-family: inherit; 
            font-size: 11px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .mode-toggle-btn.active { 
            background: var(--neon-blue); 
            color: #000; 
            font-weight: bold; 
            box-shadow: 0 0 10px var(--neon-blue); 
        }

        /* センサーインジケーター表示領域 */
        .sensor-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 8px;
            margin: 6px 0;
            border-radius: 4px;
        }

        .sensor-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sensor-header {
            width: 85px;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            color: var(--neon-blue);
        }

        .bar-bg {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 2px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--neon-blue);
            width: 0%;
            transition: width 0.1s ease-out, background-color 0.2s;
        }

        .sensor-led {
            width: 35px;
            padding: 2px 0;
            text-align: center;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid #555;
            background: #222;
            color: #777;
            border-radius: 3px;
            transition: 0.2s;
        }

        .sensor-led.active {
            background: var(--neon-red);
            color: #fff;
            border-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        /* シリアルモニタ表示領域 */
        #console-log { 
            height: 75px; 
            overflow-y: auto; 
            color: var(--neon-green); 
            margin-top: 5px; 
            border-top: 1px solid rgba(0, 255, 255, 0.15); 
            padding-top: 5px; 
            font-size: 10px; 
            word-break: break-all;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        #portrait-warning { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 9999; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: var(--neon-red); 
        }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen">
        <h1 class="shimmer">BLE CONTROLLER</h1>
        <button class="mode-btn" onclick="connectBLE()">[ CONNECT ROBOT ]</button>
        <p style="font-size: 10px; color: #888; margin-top: 20px;">iPhone: Bluefy / Android: Chrome</p>
    </div>

    <!-- 縦画面警告 -->
    <div id="portrait-warning"><h1>🔄 ROTATE DEVICE</h1></div>

    <!-- メインUI -->
    <div id="main-ui">
        <div class="header-bar">
            <div>STATUS: <span id="link-status" style="color:var(--neon-green)">CONNECTED</span></div>
            <div id="clock">00:00:00</div>
            <div onclick="location.reload()" style="cursor:pointer; color:var(--neon-red)">[ DISCONNECT ]</div>
        </div>

        <div class="controller-root">
            <!-- 左：前後ボタン -->
            <div style="display:grid; gap:15px;">
                <div class="btn" id="btn-forward">▲</div>
                <div class="btn" id="btn-backward">▼</div>
            </div>

            <!-- 中央：メイン情報パネル（モード切替＆センサーモニタ） -->
            <div class="monitor">
                <div class="mode-toggle-container">
                    <button class="mode-toggle-btn active" id="btn-manual" onclick="switchControlMode('manual')">🎮 MANUAL</button>
                    <button class="mode-toggle-btn" id="btn-auto" onclick="switchControlMode('auto')">🤖 AUTO</button>
                </div>

                <!-- リアルタイム・センサーインジケーター -->
                <div class="sensor-container">
                    <div class="sensor-item">
                        <div class="sensor-header">
                            <span>S1 (LEFT)</span>
                            <span id="s1-val">0</span>
                        </div>
                        <div class="bar-bg">
                            <div id="s1-bar" class="bar-fill"></div>
                        </div>
                        <div id="s1-led" class="sensor-led">OFF</div>
                    </div>

                    <div class="sensor-item">
                        <div class="sensor-header">
                            <span>S2 (RIGHT)</span>
                            <span id="s2-val">0</span>
                        </div>
                        <div class="bar-bg">
                            <div id="s2-bar" class="bar-fill"></div>
                        </div>
                        <div id="s2-led" class="sensor-led">OFF</div>
                    </div>
                </div>

                <div id="value-display" style="font-size: 12px; border-bottom: 1px solid #0ff; margin-bottom: 4px; color: var(--neon-green);">:: READY ::</div>
                
                <!-- シリアルログ -->
                <div id="console-log">> BLE SYSTEM READY...<br></div>
            </div>

            <!-- 右：左右ボタン -->
            <div style="display:grid; gap:15px; grid-template-columns: 85px 85px;">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
        </div>

        <!-- 下部：緊急停止ボタン -->
        <div style="text-align: center; padding-bottom: 15px;">
            <button class="btn" id="btn-stop" style="width: 220px; height: 40px; border-color: var(--neon-red); color: var(--neon-red); font-size: 13px; clip-path: none; border-radius: 5px; margin: 0 auto;">!! EMERGENCY STOP !!</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let rxCharacteristic;

        // BLE接続処理
        async function connectBLE() {
            try {
                addLog("SEARCHING FOR ROBOT...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ROBOT_' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                // 送信チャネル
                rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

                // 受信チャネル（通知受け取り設定）
                const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleESP32Data);

                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                checkOrientation();
                setInterval(updateClock, 1000);
                addLog("CONNECTED TO ROBOT!");
            } catch (error) {
                alert("接続エラー: " + error);
            }
        }

        // ESP32からの受信データ処理（センサー表示・ログ描画）
        function handleESP32Data(event) {
            const decoder = new TextDecoder('utf-8');
            const data = decoder.decode(event.target.value);
            
            if (data.startsWith("SENS:")) {
                const parts = data.replace("SENS:", "").split(",");
                const THRESHOLD = 1000; // センサーONの閾値

                parts.forEach(part => {
                    const [key, rawVal] = part.split("=");
                    const val = parseInt(rawVal, 10);
                    if (isNaN(val)) return;

                    const percent = Math.min(100, Math.max(0, (val / 4095) * 100));

                    if (key === "S1") {
                        updateSensorUI('s1', val, percent, THRESHOLD);
                    } else if (key === "S2") {
                        updateSensorUI('s2', val, percent, THRESHOLD);
                    }
                });
            } else {
                addLog(data);
            }
        }

        // センサーUIのダイナミック更新
        function updateSensorUI(prefix, val, percent, threshold) {
            document.getElementById(`${prefix}-val`).textContent = val;
            const bar = document.getElementById(`${prefix}-bar`);
            const led = document.getElementById(`${prefix}-led`);

            bar.style.width = `${percent}%`;

            if (val >= threshold) {
                led.classList.add('active');
                led.textContent = 'ON';
                bar.style.backgroundColor = 'var(--neon-red)';
            } else {
                led.classList.remove('active');
                led.textContent = 'OFF';
                bar.style.backgroundColor = 'var(--neon-blue)';
            }
        }

        // モード切り替え関数
        function switchControlMode(mode) {
            const btnManual = document.getElementById('btn-manual');
            const btnAuto = document.getElementById('btn-auto');

            if (mode === 'auto') {
                btnManual.classList.remove('active');
                btnAuto.classList.add('active');
                send('mode_auto');
            } else {
                btnAuto.classList.remove('active');
                btnManual.classList.add('active');
                send('mode_manual');
            }
        }

        // コマンド送信関数
        function send(cmd) {
            document.getElementById('value-display').textContent = `:: EXEC: ${cmd.toUpperCase()} ::`;
            if (rxCharacteristic) {
                const encoder = new TextEncoder();
                rxCharacteristic.writeValue(encoder.encode(cmd));
            }
        }

        // ログ出力関数
        function addLog(msg) {
            const log = document.getElementById('console-log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        // 安全なタッチ判定イベントバインド（Pointer Events対応）
        function bindTouchControl(elementId, command) {
            const btn = document.getElementById(elementId);
            if (!btn) return;

            const handleStart = (e) => {
                e.preventDefault();
                send(command);
            };

            const handleEnd = (e) => {
                e.preventDefault();
                send('stop');
            };

            btn.addEventListener('pointerdown', handleStart);
            btn.addEventListener('pointerup', handleEnd);
            btn.addEventListener('pointerleave', handleEnd);
            btn.addEventListener('pointercancel', handleEnd);
        }

        // DOM読み込み後にボタンバインドを設定
        window.addEventListener('DOMContentLoaded', () => {
            bindTouchControl('btn-forward', 'forward');
            bindTouchControl('btn-backward', 'backward');
            bindTouchControl('btn-left', 'left');
            bindTouchControl('btn-right', 'right');

            // 緊急停止ボタンの設定
            const stopBtn = document.getElementById('btn-stop');
            if (stopBtn) {
                stopBtn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    switchControlMode('manual');
                    send('stop');
                });
            }
        });

        // 画面向きチェックと時計の更新
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }

        function checkOrientation() {
            if (document.getElementById('start-screen').style.display === 'none') {
                const isPortrait = window.innerHeight > window.innerWidth;
                document.getElementById('portrait-warning').style.display = isPortrait ? 'flex' : 'none';
                document.getElementById('main-ui').style.display = isPortrait ? 'none' : 'flex';
            }
        }
        window.addEventListener('resize', checkOrientation);
    </script>
</body>
</html>
