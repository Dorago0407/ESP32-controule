<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESP32 DUAL-MODE CONTROLLER</title>
    <style>
        :root { --neon-blue: #00ffff; --neon-red: #ff0055; --neon-green: #00ff00; --bg-dark: #050a10; }
        * { -webkit-user-select: none; user-select: none; touch-action: none; box-sizing: border-box; -webkit-touch-callout: none; }
        body { background-color: var(--bg-dark); color: var(--neon-blue); font-family: 'Courier New', monospace; margin: 0; height: 100vh; overflow: hidden; position: fixed; width: 100%; }
        
        body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1000; }

        /* スタート画面 */
        #start-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 10001; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .shimmer { font-size: 28px; text-shadow: 0 0 15px var(--neon-blue); animation: blink 2s infinite; margin-bottom: 30px; }
        .mode-btn { background: none; border: 2px solid var(--neon-blue); color: var(--neon-blue); padding: 15px 30px; font-family: inherit; cursor: pointer; width: 260px; font-size: 18px; transition: 0.3s; }
        .mode-btn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 15px var(--neon-blue); }

        /* メインUI */
        #main-ui { display: none; flex-direction: column; height: 100vh; }
        .header-bar { display: flex; justify-content: space-between; padding: 5px 20px; border-bottom: 2px solid var(--neon-blue); font-size: 12px; background: rgba(0, 255, 255, 0.05); align-items: center; }
        .controller-root { display: flex; justify-content: space-between; align-items: center; flex: 1; padding: 10px 40px; }
        
        /* 操作ボタン */
        .btn { width: 90px; height: 90px; background: rgba(0, 255, 255, 0.05); border: 1px solid var(--neon-blue); color: var(--neon-blue); font-size: 30px; display: flex; justify-content: center; align-items: center; clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%); cursor: pointer; }
        .btn:active { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }
        
        /* 中央モニター */
        .monitor { background: rgba(0,255,255,0.02); border: 1px solid rgba(0,255,255,0.2); padding: 10px; font-size: 10px; }
        #console-log { height: 50px; overflow: hidden; color: var(--neon-green); margin-top: 5px; border-top: 1px solid rgba(0,255,255,0.1); padding-top: 5px; }

        /* モード切り替えボタンのデザイン */
        .mode-toggle-container { display: flex; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
        .mode-toggle-btn { flex: 1; padding: 6px 0; background: rgba(0, 255, 255, 0.05); border: 1px solid var(--neon-blue); color: var(--neon-blue); font-family: inherit; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .mode-toggle-btn.active { background: var(--neon-blue); color: #000; font-weight: bold; box-shadow: 0 0 12px var(--neon-blue); }

        /* 🆕 センサー表示スタイル */
        .sensor-container { border: 1px solid rgba(0, 255, 255, 0.2); padding: 5px; margin-bottom: 6px; background: rgba(0, 0, 0, 0.3); }
        .sensor-header { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 10px; color: var(--neon-blue); }
        .sensor-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 10px; }
        .sensor-bar-bg { flex: 1; height: 6px; border: 1px solid var(--neon-blue); background: rgba(0, 0, 0, 0.5); }
        .sensor-bar-fill { height: 100%; width: 0%; background: var(--neon-blue); box-shadow: 0 0 6px var(--neon-blue); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #portrait-warning { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--neon-red); text-align: center; }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen">
        <h1 class="shimmer">BLE CONTROLLER</h1>
        <button class="mode-btn" onclick="connectBLE()">[ CONNECT ROBOT ]</button>
        <p style="font-size: 10px; color: gray; margin-top: 20px;">iPhone: Bluefyアプリ推奨 / Android: Chrome</p>
    </div>

    <div id="portrait-warning"><h1>🔄 ROTATE DEVICE</h1></div>

    <div id="main-ui">
        <div class="header-bar">
            <div>STATUS: <span id="link-status" style="color:var(--neon-green)">CONNECTED</span></div>
            <div id="clock">00:00:00</div>
            <div onclick="location.reload()" style="cursor:pointer; color:var(--neon-red)">[ DISCONNECT ]</div>
        </div>

        <div class="controller-root">
            <!-- 左：前後 -->
            <div style="display:grid; gap:20px;">
                <div class="btn" id="btn-forward">▲</div>
                <div class="btn" id="btn-backward">▼</div>
            </div>

            <!-- 中央：メイン情報パネル -->
            <div class="monitor" style="width: 290px; position: relative;">
                
                <!-- モード切り替えスイッチ -->
                <div class="mode-toggle-container">
                    <button class="mode-toggle-btn active" id="btn-manual" onclick="switchControlMode('manual')">🎮 MANUAL</button>
                    <button class="mode-toggle-btn" id="btn-auto" onclick="switchControlMode('auto')">🤖 AUTO</button>
                </div>

                <!-- 🆕 センサー表示エリア -->
                <div class="sensor-container">
                    <div class="sensor-header">
                        <span id="prev-sens" style="cursor:pointer;">◄ PREV</span>
                        <span>SENSORS (<span id="sens-page-num">1</span>/2)</span>
                        <span id="next-sens" style="cursor:pointer;">NEXT ►</span>
                    </div>

                    <!-- Page 1: S1, S2 -->
                    <div id="sens-page-1">
                        <div class="sensor-row">
                            <span>S1</span> <span id="s1-val" style="width:28px; text-align:right;">0</span>
                            <div class="sensor-bar-bg"><div class="sensor-bar-fill" id="s1-bar"></div></div>
                        </div>
                        <div class="sensor-row">
                            <span>S2</span> <span id="s2-val" style="width:28px; text-align:right;">0</span>
                            <div class="sensor-bar-bg"><div class="sensor-bar-fill" id="s2-bar"></div></div>
                        </div>
                    </div>

                    <!-- Page 2: S3, S4 -->
                    <div id="sens-page-2" style="display:none;">
                        <div class="sensor-row">
                            <span>S3</span> <span id="s3-val" style="width:28px; text-align:right;">0</span>
                            <div class="sensor-bar-bg"><div class="sensor-bar-fill" id="s3-bar"></div></div>
                        </div>
                        <div class="sensor-row">
                            <span>S4</span> <span id="s4-val" style="width:28px; text-align:right;">0</span>
                            <div class="sensor-bar-bg"><div class="sensor-bar-fill" id="s4-bar"></div></div>
                        </div>
                    </div>
                </div>

                <div id="value-display" style="font-size: 12px; border-bottom: 1px solid #0ff; margin-bottom: 4px; color: var(--neon-green);">:: READY ::</div>
                <div id="console-log">> BLE SYSTEM READY...</div>
            </div>

            <!-- 右：左右 -->
            <div style="display:grid; gap:20px; grid-template-columns: 90px 90px;">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
        </div>

        <div style="text-align: center; padding-bottom: 15px;">
            <button class="btn" id="btn-emergency" style="width: 240px; height: 42px; border-color: var(--neon-red); color: var(--neon-red); font-size: 14px; clip-path: none; border-radius: 5px; margin: 0 auto;">!! EMERGENCY STOP !!</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let rxCharacteristic;
        let currentSensPage = 1;

        async function connectBLE() {
            try {
                addLog("SEARCHING FOR ROBOT...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ROBOT' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

                // 🆕 TX通知受信の有効化（センサーデータ受信用）
                try {
                    const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);
                    await txCharacteristic.startNotifications();
                    txCharacteristic.addEventListener('characteristicvaluechanged', handleSensorData);
                } catch(e) {
                    console.log("TX Characteristic Notification not supported or missing");
                }

                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                checkOrientation();
                setInterval(updateClock, 1000);
                addLog("CONNECTED TO ROBOT!");
            } catch (error) {
                alert("接続に失敗しました: " + error);
            }
        }

        // 🆕 ESP32からのセンサーデータ受信・描画処理（例: SENS:S1=1024,S2=2048,S3=0,S4=4095）
        function handleSensorData(event) {
            const text = new TextDecoder().decode(event.target.value);
            if (text.startsWith("SENS:")) {
                const pairs = text.replace("SENS:", "").split(",");
                pairs.forEach(p => {
                    const [key, val] = p.split("=");
                    const num = parseInt(val) || 0;
                    const pct = Math.min(100, Math.max(0, (num / 4095) * 100)); // 12bit ADC (0~4095) 対応

                    if (key === "S1") { document.getElementById('s1-val').textContent = num; document.getElementById('s1-bar').style.width = pct + "%"; }
                    if (key === "S2") { document.getElementById('s2-val').textContent = num; document.getElementById('s2-bar').style.width = pct + "%"; }
                    if (key === "S3") { document.getElementById('s3-val').textContent = num; document.getElementById('s3-bar').style.width = pct + "%"; }
                    if (key === "S4") { document.getElementById('s4-val').textContent = num; document.getElementById('s4-bar').style.width = pct + "%"; }
                });
            }
        }

        // 🆕 センサー表示ページの切替機能
        document.getElementById('prev-sens').addEventListener('click', toggleSensPage);
        document.getElementById('next-sens').addEventListener('click', toggleSensPage);

        function toggleSensPage() {
            currentSensPage = currentSensPage === 1 ? 2 : 1;
            document.getElementById('sens-page-num').textContent = currentSensPage;
            document.getElementById('sens-page-1').style.display = currentSensPage === 1 ? 'block' : 'none';
            document.getElementById('sens-page-2').style.display = currentSensPage === 2 ? 'block' : 'none';
        }

        // モード切り替え処理
        function switchControlMode(mode) {
            const btnManual = document.getElementById('btn-manual');
            const btnAuto = document.getElementById('btn-auto');

            if (mode === 'auto') {
                btnManual.classList.remove('active');
                btnAuto.classList.add('active');
                send('mode_auto');
                addLog("MODE: AUTONOMOUS");
            } else {
                btnAuto.classList.remove('active');
                btnManual.classList.add('active');
                send('mode_manual');
                addLog("MODE: MANUAL");
            }
        }

        // 緊急停止処理
        function emergencyStop() {
            switchControlMode('manual');
            send('stop');
        }

        function send(cmd) {
            document.getElementById('value-display').textContent = `:: EXEC: ${cmd.toUpperCase()} ::`;
            addLog(cmd.toUpperCase());
            
            if (rxCharacteristic) {
                const encoder = new TextEncoder();
                rxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
            }
        }

        function addLog(msg) {
            const log = document.getElementById('console-log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }

        function checkOrientation() {
            if (document.getElementById('start-screen').style.display === 'none') {
                const isPortrait = window.innerHeight > window.innerWidth;
                document.getElementById('portrait-warning').style.display = isPortrait ? 'flex' : 'none';
                document.getElementById('main-ui').style.display = isPortrait ? 'none' : 'flex';
            }
        }
        window.addEventListener('resize', checkOrientation);

        // タッチ＆マウス操作の確実なバインド
        function bindControl(elementId, actionCmd) {
            const el = document.getElementById(elementId);
            if (!el) return;

            const handleStart = (e) => {
                e.preventDefault();
                e.stopPropagation();
                send(actionCmd);
            };

            const handleEnd = (e) => {
                e.preventDefault();
                e.stopPropagation();
                send('stop');
            };

            el.addEventListener('touchstart', handleStart, { passive: false });
            el.addEventListener('touchend', handleEnd, { passive: false });
            el.addEventListener('mousedown', handleStart);
            el.addEventListener('mouseup', handleEnd);
            el.addEventListener('mouseleave', handleEnd);
        }

        bindControl('btn-forward', 'forward');
        bindControl('btn-backward', 'backward');
        bindControl('btn-left', 'left');
        bindControl('btn-right', 'right');

        // 緊急停止ボタンの単発バインド
        const emBtn = document.getElementById('btn-emergency');
        const handleEmergency = (e) => {
            e.preventDefault();
            e.stopPropagation();
            emergencyStop();
        };
        emBtn.addEventListener('touchstart', handleEmergency, { passive: false });
        emBtn.addEventListener('mousedown', handleEmergency);
    </script>
</body>
</html>
