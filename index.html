<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESP32 BLE CONTROLLER</title>
    <style>
        :root { --neon-blue: #00ffff; --neon-red: #ff0055; --neon-green: #00ff00; --bg-dark: #050a10; }
        * { -webkit-user-select: none; user-select: none; touch-action: none; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--neon-blue); font-family: 'Courier New', monospace; margin: 0; height: 100vh; overflow: hidden; position: fixed; width: 100%; }
        
        body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1000; }

        /* スタート画面 */
        #start-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 10001; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .shimmer { font-size: 28px; text-shadow: 0 0 15px var(--neon-blue); animation: blink 2s infinite; margin-bottom: 30px; }
        .mode-btn { background: none; border: 2px solid var(--neon-blue); color: var(--neon-blue); padding: 15px 30px; font-family: inherit; cursor: pointer; width: 260px; font-size: 18px; transition: 0.3s; }
        .mode-btn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 15px var(--neon-blue); }

        /* メインUI */
        #main-ui { display: none; flex-direction: column; height: 100vh; }
        .header-bar { display: flex; justify-content: space-between; padding: 5px 20px; border-bottom: 2px solid var(--neon-blue); font-size: 12px; background: rgba(0, 255, 255, 0.05); align-items: center; }
        .controller-root { display: flex; justify-content: space-between; align-items: center; flex: 1; padding: 10px 40px; }
        
        /* ボタン */
        .btn { width: 90px; height: 90px; background: rgba(0, 255, 255, 0.05); border: 1px solid var(--neon-blue); color: var(--neon-blue); font-size: 30px; display: flex; justify-content: center; align-items: center; clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%); }
        .btn:active { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }
        
        .monitor { background: rgba(0,255,255,0.02); border: 1px solid rgba(0,255,255,0.2); padding: 10px; font-size: 10px; }
        #console-log { height: 80px; overflow: hidden; color: var(--neon-green); margin-top: 5px; border-top: 1px solid rgba(0,255,255,0.1); padding-top: 5px; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #portrait-warning { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--neon-red); text-align: center; }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen">
        <h1 class="shimmer">BLE CONTROLLER</h1>
        <button class="mode-btn" onclick="connectBLE()">[ CONNECT ROBOT ]</button>
        <p style="font-size: 10px; color: gray; margin-top: 20px;">iPhone: Bluefyアプリ推奨 / Android: Chrome</p>
    </div>

    <div id="portrait-warning"><h1>🔄 ROTATE DEVICE</h1></div>

    <div id="main-ui">
        <div class="header-bar">
            <div>STATUS: <span id="link-status" style="color:var(--neon-green)">CONNECTED</span></div>
            <div id="clock">00:00:00</div>
            <div onclick="location.reload()" style="cursor:pointer; color:var(--neon-red)">[ DISCONNECT ]</div>
        </div>

        <div class="controller-root">
            <!-- 左：前後 -->
            <div style="display:grid; gap:20px;">
                <div class="btn" ontouchstart="send('forward')" ontouchend="send('stop')">▲</div>
                <div class="btn" ontouchstart="send('backward')" ontouchend="send('stop')">▼</div>
            </div>

            <!-- 中央：メイン情報パネル -->
            <div class="monitor" style="width: 280px; position: relative;">
                <div id="value-display" style="font-size: 16px; border-bottom: 1px solid #0ff; margin-bottom: 8px; color: var(--neon-green);">:: READY ::</div>
                <div id="console-log">> BLE SYSTEM READY...</div>
            </div>

            <!-- 右：左右 -->
            <div style="display:grid; gap:20px; grid-template-columns: 90px 90px;">
                <div class="btn" ontouchstart="send('left')" ontouchend="send('stop')">◀</div>
                <div class="btn" ontouchstart="send('right')" ontouchend="send('stop')">▶</div>
            </div>
        </div>

        <div style="text-align: center; padding-bottom: 20px;">
            <button class="btn" style="width: 240px; height: 50px; border-color: var(--neon-red); color: var(--neon-red); font-size: 14px; clip-path: none; border-radius: 5px;" ontouchstart="send('stop')">!! EMERGENCY STOP !!</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let rxCharacteristic;

        async function connectBLE() {
            try {
                addLog("SEARCHING FOR ROBOT...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ROBOT_BLE_CTRL' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                checkOrientation();
                setInterval(updateClock, 1000);
                addLog("CONNECTED TO ROBOT!");
            } catch (error) {
                alert("接続に失敗しました: " + error);
            }
        }

        function send(cmd) {
            document.getElementById('value-display').textContent = `:: EXEC: ${cmd.toUpperCase()} ::`;
            addLog(cmd.toUpperCase());
            
            if (rxCharacteristic) {
                const encoder = new TextEncoder();
                rxCharacteristic.writeValue(encoder.encode(cmd));
            }
        }

        function addLog(msg) {
            const log = document.getElementById('console-log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }

        function checkOrientation() {
            if (document.getElementById('start-screen').style.display === 'none') {
                const isPortrait = window.innerHeight > window.innerWidth;
                document.getElementById('portrait-warning').style.display = isPortrait ? 'flex' : 'none';
                document.getElementById('main-ui').style.display = isPortrait ? 'none' : 'flex';
            }
        }
        window.addEventListener('resize', checkOrientation);
    </script>
</body>
</html>
