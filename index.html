<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESP32 BLE MONITOR</title>
    <style>
        :root { --neon-blue: #00ffff; --neon-red: #ff0055; --neon-green: #00ff00; --bg-dark: #050a10; }
        * { -webkit-user-select: none; user-select: none; touch-action: none; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--neon-blue); font-family: 'Courier New', monospace; margin: 0; height: 100vh; overflow: hidden; position: fixed; width: 100%; }
        
        body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1000; }

        #start-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 10001; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .shimmer { font-size: 28px; text-shadow: 0 0 15px var(--neon-blue); animation: blink 2s infinite; margin-bottom: 30px; }
        .mode-btn { background: none; border: 2px solid var(--neon-blue); color: var(--neon-blue); padding: 15px 30px; font-family: inherit; cursor: pointer; width: 260px; font-size: 18px; }

        #main-ui { display: none; flex-direction: column; height: 100vh; }
        .header-bar { display: flex; justify-content: space-between; padding: 5px 20px; border-bottom: 2px solid var(--neon-blue); font-size: 12px; background: rgba(0, 255, 255, 0.05); }
        .controller-root { display: flex; justify-content: space-between; align-items: center; flex: 1; padding: 10px 30px; }
        
        .btn { width: 85px; height: 85px; background: rgba(0, 255, 255, 0.05); border: 1px solid var(--neon-blue); color: var(--neon-blue); font-size: 28px; display: flex; justify-content: center; align-items: center; clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%); }
        .btn:active { background: var(--neon-blue); color: #000; }
        
        .monitor { background: rgba(0,255,255,0.02); border: 1px solid rgba(0,255,255,0.2); padding: 10px; font-size: 11px; width: 300px; }
        
        /* 🆕 センサー表示スタイル */
        .sensor-box { display: flex; justify-content: space-around; background: rgba(0,255,0,0.05); border: 1px solid var(--neon-green); padding: 5px; margin: 5px 0; color: var(--neon-green); font-weight: bold; }
        
        /* 🆕 シリアル風ログ */
        #console-log { height: 90px; overflow-y: auto; color: var(--neon-green); margin-top: 5px; border-top: 1px solid rgba(0,255,255,0.1); padding-top: 5px; font-size: 10px; }

        .mode-toggle-container { display: flex; justify-content: space-between; margin-bottom: 5px; gap: 6px; }
        .mode-toggle-btn { flex: 1; padding: 6px 0; background: rgba(0, 255, 255, 0.05); border: 1px solid var(--neon-blue); color: var(--neon-blue); font-family: inherit; font-size: 11px; cursor: pointer; }
        .mode-toggle-btn.active { background: var(--neon-blue); color: #000; font-weight: bold; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #portrait-warning { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--neon-red); }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 class="shimmer">BLE CONTROLLER</h1>
        <button class="mode-btn" onclick="connectBLE()">[ CONNECT ROBOT ]</button>
    </div>

    <div id="portrait-warning"><h1>🔄 ROTATE DEVICE</h1></div>

    <div id="main-ui">
        <div class="header-bar">
            <div>STATUS: <span id="link-status" style="color:var(--neon-green)">CONNECTED</span></div>
            <div id="clock">00:00:00</div>
            <div onclick="location.reload()" style="cursor:pointer; color:var(--neon-red)">[ DISCONNECT ]</div>
        </div>

        <div class="controller-root">
            <div style="display:grid; gap:15px;">
                <div class="btn" ontouchstart="send('forward')" ontouchend="send('stop')">▲</div>
                <div class="btn" ontouchstart="send('backward')" ontouchend="send('stop')">▼</div>
            </div>

            <!-- 中央モニター（センサー値とリアルタイムログ表示） -->
            <div class="monitor">
                <div class="mode-toggle-container">
                    <button class="mode-toggle-btn active" id="btn-manual" onclick="switchControlMode('manual')">🎮 MANUAL</button>
                    <button class="mode-toggle-btn" id="btn-auto" onclick="switchControlMode('auto')">🤖 AUTO</button>
                </div>

                <!-- 🆕 センサー表示エリア -->
                <div class="sensor-box">
                    <span id="s1-val">S1: ---</span>
                    <span id="s2-val">S2: ---</span>
                </div>

                <div id="value-display" style="font-size: 13px; border-bottom: 1px solid #0ff; margin-bottom: 4px; color: var(--neon-green);">:: READY ::</div>
                
                <!-- 🆕 シリアルモニタ表示領域 -->
                <div id="console-log">> BLE MONITOR READY...<br></div>
            </div>

            <div style="display:grid; gap:15px; grid-template-columns: 85px 85px;">
                <div class="btn" ontouchstart="send('left')" ontouchend="send('stop')">◀</div>
                <div class="btn" ontouchstart="send('right')" ontouchend="send('stop')">▶</div>
            </div>
        </div>

        <div style="text-align: center; padding-bottom: 15px;">
            <button class="btn" style="width: 220px; height: 40px; border-color: var(--neon-red); color: var(--neon-red); font-size: 13px; clip-path: none; border-radius: 5px;" ontouchstart="emergencyStop()">!! EMERGENCY STOP !!</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 🆕 データ受信用

        let rxCharacteristic;

        async function connectBLE() {
            try {
                addLog("SEARCHING...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ROBOT_' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                // 送信用 (スマホ -> ESP32)
                rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

                // 🆕 受信用 (ESP32 -> スマホ)
                const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleESP32Data);

                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                checkOrientation();
                setInterval(updateClock, 1000);
                addLog("CONNECTED!");
            } catch (error) {
                alert("接続エラー: " + error);
            }
        }

        // 🆕 ESP32から送られてきたデータ（センサーやステータス）を処理
        function handleESP32Data(event) {
            const decoder = new TextDecoder('utf-8');
            const data = decoder.decode(event.target.value);
            
            if (data.startsWith("SENS:")) {
                // センサーデータのパース例 "SENS:S1=512,S2=1024"
                const parts = data.replace("SENS:", "").split(",");
                parts.forEach(part => {
                    const [key, val] = part.split("=");
                    if (key === "S1") document.getElementById('s1-val').textContent = `S1: ${val}`;
                    if (key === "S2") document.getElementById('s2-val').textContent = `S2: ${val}`;
                });
            } else {
                // その他のメッセージはシリアルモニタログに吐き出す
                addLog(data);
            }
        }

        function switchControlMode(mode) {
            const btnManual = document.getElementById('btn-manual');
            const btnAuto = document.getElementById('btn-auto');

            if (mode === 'auto') {
                btnManual.classList.remove('active');
                btnAuto.classList.add('active');
                send('mode_auto');
            } else {
                btnAuto.classList.remove('active');
                btnManual.classList.add('active');
                send('mode_manual');
            }
        }

        function emergencyStop() {
            switchControlMode('manual');
            send('stop');
        }

        function send(cmd) {
            document.getElementById('value-display').textContent = `:: EXEC: ${cmd.toUpperCase()} ::`;
            if (rxCharacteristic) {
                const encoder = new TextEncoder();
                rxCharacteristic.writeValue(encoder.encode(cmd));
            }
        }

        function addLog(msg) {
            const log = document.getElementById('console-log');
            log.innerHTML += `> ${msg}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }

        function checkOrientation() {
            if (document.getElementById('start-screen').style.display === 'none') {
                const isPortrait = window.innerHeight > window.innerWidth;
                document.getElementById('portrait-warning').style.display = isPortrait ? 'flex' : 'none';
                document.getElementById('main-ui').style.display = isPortrait ? 'none' : 'flex';
            }
        }
        window.addEventListener('resize', checkOrientation);
    </script>
</body>
</html>
