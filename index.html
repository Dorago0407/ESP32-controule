<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { -webkit-user-select: none; user-select: none; touch-action: none; box-sizing: border-box; }
        
        /* ハイテク背景（回路図風グリッド） */
        body {
            background-color: #050a10;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 255, .05) 25%, rgba(0, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, .05) 75%, rgba(0, 255, 255, .05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 255, .05) 25%, rgba(0, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, .05) 75%, rgba(0, 255, 255, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            color: #00ffff;
            font-family: 'Arial Black', sans-serif; /* 近未来的フォント */
            margin: 0; height: 100vh; overflow: hidden;
        }

        /* ⚙設定ボタン（ネオングロー） */
        .settings-trigger {
            position: absolute; top: 15px; right: 15px;
            width: 44px; height: 44px; background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff; border-radius: 5px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; z-index: 100; color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        /* 設定メニュー（オーバーレイ） */
        #settings-menu {
            position: fixed; inset: 0; background: rgba(0, 10, 20, 0.95);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 200; border: 2px solid #00ffff;
        }
        .config-box { text-align: center; }
        .config-box h3 { text-shadow: 0 0 15px #00ffff; }
        input {
            background: rgba(0, 255, 255, 0.1); color: #00ff00; border: 1px solid #00ffff;
            padding: 12px; width: 220px; text-align: center; font-family: monospace; font-size: 20px;
            margin: 25px 0; border-radius: 5px; box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .close-btn {
            background: transparent; color: #00ffff; border: 2px solid #00ffff; padding: 12px 40px;
            border-radius: 5px; font-weight: bold; font-size: 16px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        .close-btn:active { background: #00ffff; color: #000; }

        /* ステータス表示（発光） */
        #value-display {
            background: rgba(0, 0, 0, 0.5); color: #00ff00; font-size: 24px;
            padding: 12px; text-align: center; font-weight: bold; letter-spacing: 4px;
            border-bottom: 1px solid #00ffff; text-shadow: 0 0 10px #00ff00;
        }

        /* 操作画面レイアウト */
        .controller-root { display: flex; justify-content: space-around; align-items: center; height: calc(100vh - 50px); }
        .d-pad { display: grid; grid-template-columns: repeat(3, 90px); gap: 15px; }

        /* ハイテクボタン共通スタイル */
        .btn {
            width: 90px; height: 90px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 10px; /* 角を少し丸く */
            color: #00ffff; font-size: 36px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.1);
            text-shadow: 0 0 10px #00ffff;
            transition: all 0.1s;
        }

        /* 押した時の演出（ネオン爆発） */
        .btn:active {
            background: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.4);
            color: #fff;
            transform: scale(0.95);
        }

        /* 十字キー配置 */
        .up { grid-column: 2; }
        .left { grid-column: 1; }
        .right { grid-column: 3; }
        .down { grid-column: 2; }

        /* 緊急停止ボタン（レッドネオン） */
        .stop-btn {
            border-color: #ff0055;
            color: #ff0055;
            background: rgba(255, 0, 85, 0.1);
            border-radius: 5px; width: 140px; font-size: 18px; font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            text-shadow: 0 0 10px #ff0055;
        }
        .stop-btn:active {
            background: rgba(255, 0, 85, 0.5);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
        }

        /* 横画面強制オーバーレイ */
        @media screen and (orientation: portrait) {
            body::before {
                content: "SYSTEM ERROR: ROTATE DEVICE";
                position: fixed; inset: 0; background: #000; z-index: 9999;
                display: flex; justify-content: center; align-items: center;
                color: #ff0000; font-size: 20px; text-shadow: 0 0 10px #ff0000;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="settings-trigger" onclick="toggleSettings(true)">⚙</div>

    <div id="settings-menu">
        <div class="config-box">
            <h3>&lt; CONFIGURATION &gt;</h3>
            <p>Target ESP32 IP:</p>
            <input type="text" id="ip-address" value="192.168.4.1" onchange="saveIP()">
            <br>
            <button class="close-btn" onclick="toggleSettings(false)">SAVE & CLOSE</button>
        </div>
    </div>

    <div id="value-display">:: STATUS: READY ::</div>

    <div class="controller-root">
        <div class="d-pad">
            <div class="btn up" ontouchstart="send('forward')" ontouchend="send('stop')">▲</div>
            <div class="btn left" ontouchstart="send('left')" ontouchend="send('stop')">◀</div>
            <div class="btn right" ontouchstart="send('right')" ontouchend="send('stop')">▶</div>
            <div class="btn down" ontouchstart="send('backward')" ontouchend="send('stop')">▼</div>
        </div>
        <div class="action-buttons">
            <div class="btn stop-btn" ontouchstart="send('stop')">! ABORT !</div>
        </div>
    </div>

    <script>
        function toggleSettings(show) {
            document.getElementById('settings-menu').style.display = show ? 'flex' : 'none';
        }
        window.onload = function() {
            const savedIP = localStorage.getItem('esp32_ip');
            if (savedIP) document.getElementById('ip-address').value = savedIP;
        };
        function saveIP() {
            const ip = document.getElementById('ip-address').value;
            localStorage.setItem('esp32_ip', ip);
        }
        function send(dir) {
            const ip = document.getElementById('ip-address').value;
            const url = `http://${ip}/move?dir=${dir}`;
            // 表示をサイバー風に
            document.getElementById('value-display').textContent = `:: CMD: ${dir.toUpperCase()} ::`;
            fetch(url).catch(() => {});
        }
    </script>
</body>
</html>
